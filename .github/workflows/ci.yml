name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    name: Backend (Postgres + Migraciones + Lint + Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reservas
          POSTGRES_PASSWORD: reservas_dev_password
          POSTGRES_DB: reservas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reservas -d reservas_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      JWT_SECRET: ci_jwt_secret_key_for_tests_only
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      DATABASE_URL: postgres://reservas:reservas_dev_password@localhost:5432/reservas_dev
      DATABASE_URL_TEST: postgres://reservas:reservas_dev_password@localhost:5432/reservas_test
      WORK_HOUR_START: '08:00'
      WORK_HOUR_END: '22:00'
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run migrate

      - name: Run backend linter
        run: npm run lint

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend (Lint + Tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend linter
        run: npm run lint

      - name: Run frontend tests
        run: npm test

