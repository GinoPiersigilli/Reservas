version: 2
updates:
  # Dependencias de producción y desarrollo de Node.js en backend
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actualizaciones-menores-parche:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Dependencias de producción y desarrollo de Node.js en frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actualizaciones-menores-parche:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Imágenes base en Dockerfile de backend
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-docker)"
    groups:
      actualizaciones-menores-parche:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        versions: ["21.x", "23.x", "25.x", "27.x", "29.x"]

  # Imágenes base en Dockerfile de frontend
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-docker)"
    groups:
      actualizaciones-menores-parche:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        versions: ["21.x", "23.x", "25.x", "27.x", "29.x"]

  # Acciones de GitHub Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actualizaciones-menores-parche:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
